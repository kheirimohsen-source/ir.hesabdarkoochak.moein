/* Compact, high-contrast LCD palette */
:root{--ink:#8bdcff;--muted:#79b9d3;--line:#31566b;--paper:#102b3d;--bg:#071a29;--blue:#38bdf8;--teal:#5ce1e6;--red:#ff9ba8;--shadow:0 5px 14px #0007,inset 0 1px #ffffff12;--metal:linear-gradient(180deg,#21445a,#142f43 45%,#10283a);--metal-dark:linear-gradient(180deg,#18384d,#0b2233 55%,#102b3d)}

.tile,.action{background:var(--metal);color:#7dd3fc;text-shadow:0 0 6px #38bdf844;border-color:#31566b}.tile .ico,.tile small,.action span{color:#5ccfff;text-shadow:none}.tile small{font-size:11px}.tiles{gap:clamp(8px,1.5vw,13px)}.tile{aspect-ratio:1.12/1;gap:3px;padding:6px}.action{padding:10px 12px;font-size:16px}.action span{font-size:22px;margin-bottom:2px}.actions{gap:8px;margin-top:8px}
.field{gap:3px}.field label,.small-muted,.tiny,.sub{color:#8bdcff}.field label{font-size:13px}.form{gap:8px}.field input,.field select,.field textarea,.person-add input,input,select,textarea{background:#0a2030;color:#a6e8ff;border-color:#37627a}input::placeholder,textarea::placeholder{color:#679bb2;opacity:1}.field input:focus,.field select:focus,.field textarea:focus{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf833}
input[type=checkbox]{accent-color:#38bdf8}.btn,.cal-head button{background:linear-gradient(180deg,#25495e,#173247 55%,#1e3d51);border-color:#41677c;color:#8bdcff;text-shadow:0 0 5px #38bdf833;box-shadow:0 2px 4px #0005,inset 0 1px #ffffff14;padding:5px 10px}.btn.teal{background:linear-gradient(#177d91,#0b5269);color:#d4f8ff}.btn.secondary{color:#8bdcff}.btn.danger{background:linear-gradient(#653944,#39252f);color:#ffb1ba}

.notice{padding:7px 9px;background:#12344a;color:#8bdcff;border-color:#31566b}.notice.warn{background:#3d3520;color:#ffe29b}.dialog{background:linear-gradient(145deg,#18384d,#0b2233);border-color:#31566b;color:#8bdcff}.dialog p{color:#8bdcff}.cal-grid div{color:#8bdcff}.cal-grid button{background:linear-gradient(#21445a,#142f43);color:#8bdcff;border-color:#31566b}.cal-grid button:hover,.cal-grid button.selected{background:#087ba7;color:#e4faff}

/* ==== Final: every gray/silver button, tile and action gets bold BLACK text ==== */
:root{--metal:linear-gradient(180deg,#fbfcfd 0%,#cdd3d7 14%,#eef1f2 30%,#bcc3c8 54%,#e6e9ea 78%,#aab2b7 100%)}
.tile,.action,.btn,.btn.secondary,.btn.gray,.cal-head button,.cal-grid button{
  background:var(--metal)!important;color:#000000!important;-webkit-text-fill-color:#000000!important;
  font-weight:800!important;text-shadow:none!important;border-color:#7d8991!important}
.tile *,.action *,.btn *,.cal-head button *,.cal-grid button *{
  color:#000000!important;-webkit-text-fill-color:#000000!important;text-shadow:none!important}
.tile .ico,.tile small,.action span{color:#000000!important;-webkit-text-fill-color:#000000!important;opacity:1!important}
.tile:hover,.tile:focus,.action:hover,.action:focus,.btn:hover,.btn:focus,.btn.secondary:hover,.btn.gray:hover,.cal-head button:hover,.cal-grid button:hover{
  background:linear-gradient(180deg,#ffffff,#d7dcdf 50%,#c2c9ce)!important;color:#000000!important;-webkit-text-fill-color:#000000!important;text-shadow:none!important}
.tile:active,.action:active,.btn:active,.cal-grid button.selected{filter:none!important;background:linear-gradient(180deg,#e3e7e9,#c5cbd0)!important;color:#000000!important;-webkit-text-fill-color:#000000!important}
.cal-grid button.selected{outline:2px solid #7d8991;outline-offset:-3px}
/* Colored (teal/danger) buttons keep their own palette but must never be gray */
.btn.teal{background:linear-gradient(#177d91,#0b5269)!important;color:#d4f8ff!important;-webkit-text-fill-color:#d4f8ff!important;border-color:#125d60!important}
.btn.danger{background:linear-gradient(#653944,#39252f)!important;color:#ffb1ba!important;-webkit-text-fill-color:#ffb1ba!important;border-color:#6d3f4a!important}
.btn.teal *,.btn.danger *{color:inherit!important;-webkit-text-fill-color:inherit!important}
 .date-entry{display:flex;gap:7px;align-items:stretch}.date-entry input{flex:1;min-width:0}.date-entry button{white-space:nowrap}
/* ==== Personal accounting preference under home tiles ==== */
.personal-pref{display:flex;align-items:center;gap:9px;margin:14px 0 2px;padding:9px 12px;border:1px solid #31566b;border-radius:9px;background:linear-gradient(145deg,#153449,#0e2638);color:#8bdcff;font-weight:700;cursor:pointer;box-shadow:inset 0 1px #ffffff12}
.personal-pref input{width:18px;height:18px;margin:0;cursor:pointer}
/* ==== Home navigation tiles: larger labels ==== */
.tiles .tile{font-size:clamp(20px,2.4vw,22px)!important;line-height:1.5}
@media(max-width:700px){.tiles .tile{font-size:20px!important}}

<body><div class="shell"><header class="top"><div class="brand">حسابداری کوچک معین</div><div class="today" id="today"></div></header><main id="app" class="page"></main><footer class="footer">اطلاعات این برنامه فقط در همین مرورگر ذخیره می‌شود.</footer></div><div id="overlay"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), app=$('#app'), overlay=$('#overlay'), fa=new Intl.NumberFormat('fa-IR');
let state={people:[],records:[],invoices:[],goods: null}, memoryOnly=false, routes=[{s:'home'}], idx=0, personalMode=false;const PERSONAL_KEY='hesabYarPersonalAccounting';function savePersonalMode(){try{localStorage.setItem(PERSONAL_KEY,personalMode?'1':'0')}catch(e){}}function loadPersonalMode(){try{let v=localStorage.getItem(PERSONAL_KEY);personalMode=v==='1'}catch(e){personalMode=false}}
const invoiceKind=i=>i?.kind==='purchase'||i?.type==='purchase'?'purchase':'sale';const visibleInvoices=()=>personalMode?[]:state.invoices;
const esc=s=>String(s??''), id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), latin=s=>String(s||'').replace(/[۰-۹]/g,c=>'0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(c)]).replace(/[٠-٩]/g,c=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(c)]).trim(), money=n=>fa.format(Number(n)||0);
function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add('hidden'),2700)}
const TRIAL_KEY='hesabYarTrialCount', TRIAL_LIMIT=30;function trialCount(){try{let n=Number(localStorage.getItem(TRIAL_KEY));return Number.isFinite(n)&&n>=0?n:state.records.length+state.invoices.length}catch(e){return state.records.length+state.invoices.length}}function trialBlocked(){return trialCount()>=TRIAL_LIMIT}function showTrialModal(){let m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');let box=document.createElement('section');box.className='dialog';let msg=document.createElement('p');msg.textContent='نسخه آزمایشی به پایان رسید. برای ثبت تراکنش‌های بیشتر، لطفاً اشتراک سالانه حسابداری کوچک معین را از طریق مایکت تهیه کنید.';let note=document.createElement('p');note.textContent='خرید اشتراک از مایکت';let close=button('بستن',()=>m.remove(),'btn secondary');box.append(msg,note,close);m.append(box);m.addEventListener('click',e=>{if(e.target===m)m.remove()});overlay.append(m)}function bumpTrial(){try{localStorage.setItem(TRIAL_KEY,String(trialCount()+1))}catch(e){}}
function save(){try{localStorage.setItem('hesabYarV1',JSON.stringify(state));memoryOnly=false}catch(e){memoryOnly=true;toast('ذخیره‌سازی ناموفق است؛ اطلاعات تا بستن صفحه موقت است.')}}
function load(){loadPersonalMode();try{let d=JSON.parse(localStorage.getItem('hesabYarV1')||'{}');for(let k of ['people','records','invoices'])state[k]=Array.isArray(d[k])?d[k]:[];state.goods=typeof d.goods==='boolean'?d.goods:null;state.products=Array.isArray(d.products)?d.products.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||id(),name:String(x.name??x.description??''),buy:Number(latin(x.buy??x.purchasePrice))||0,sell:Number(latin(x.sell??x.salePrice))||0,qty:Number(latin(x.qty??x.stock))||0})):[]}catch(e){memoryOnly=true;toast('داده‌های ذخیره‌شده قابل خواندن نیستند؛ ذخیره موقت فعال شد.')} }
function nav(s,opts={}){routes=routes.slice(0,idx+1);routes.push({s,...opts});idx++;try{history.pushState({hy:1,idx,route:routes[idx]},'','#'+s)}catch(e){}render()}
function back(){if(overlay.firstChild){overlay.replaceChildren();return}if(idx>0){history.back();return}home()}
window.addEventListener('popstate',e=>{if(e.state?.hy){idx=e.state.idx;routes=routes.slice(0,idx+1);render()}else{idx=0;home()}});window.addEventListener('keydown',e=>{if(e.key==='Escape'){back();e.preventDefault()}});
function head(title){let d=document.createElement('div');d.className='title-line';let h=document.createElement('h1');h.textContent=title;h.style.margin='0';d.append(h);let b=document.createElement('button');b.className='btn secondary back-btn';b.textContent='‹ بازگشت';b.onclick=back;d.append(b);return d}
function panel(){let x=document.createElement('section');x.className='panel';return x}
function button(text,fn,cls='btn secondary'){let b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.onclick=fn;return b}

>{let g=state.products.find(x=>x.name===d.value);if(g){price.value=Number(g.sell)>0?g.sell:''}calc()};[q,price].forEach(x=>x.oninput=calc);td1.append(d);td2.append(q);td3.append(price);td4.append(total);del.append(button('×',()=>{tr.remove();calc()},'btn danger'));tr.append(td1,td2,td3,td4,del);tbody.append(tr);calc()}function calc(){let n=0;[...tbody.rows].forEach(r=>{let v=(Number(r.cells[1].querySelector('input').value)||0)*(Number(r.cells[2].querySelector('input').value)||0);r.cells[3].textContent=money(v);n+=v});sum.textContent='جمع کل: '+money(n)+' تومان'}t.append(tbody);table.append(t);f.append(table,button('＋ افزودن ردیف',()=>addRow()),sum);(old?.items||[{}]).forEach(addRow);let saveb=button('ذخیره فاکتور',()=>{},'btn teal');saveb.type='submit';f.append(saveb);f.onsubmit=e=>{e.preventDefault();if(!old&&trialBlocked()){showTrialModal();return}let items=[...tbody.rows].map(r=>({name:r.cells[0].querySelector('input').value.trim(),qty:Number(r.cells[1].querySelector('input').value),price:Number(r.cells[2].querySelector('input').value)}));if(!person.value)return toast('طرف حساب را انتخاب کنید.');if(!date.value.trim())return toast('تاریخ را وارد کنید.');if(items.some(x=>!x.name||x.qty<=0||x.price<0||!Number.isFinite(x.price)))return toast('شرح، تعداد مثبت و مبلغ معتبر هر ردیف الزامی است.');let x={id:iid||id(),kind,personId:person.value,date:date.value.trim(),number:number.value.trim()||('F-'+Date.now()),items,total:items.reduce((a,b)=>a+b.qty*b.price,0),settled:settled.checked};if(old)Object.assign(old,x);else{state.invoices.push(x);bumpTrial()}save();toast('فاکتور ذخیره شد.');back()};p.append(f);app.append(p)}
load();try{if(localStorage.getItem(TRIAL_KEY)===null)localStorage.setItem(TRIAL_KEY,String(state.records.length+state.invoices.length))}catch(e){}$('#today').textContent=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'short'}).format(new Date());window.addEventListener('beforeunload',()=>{try{localStorage.setItem('hesabYarV1',JSON.stringify(state))}catch(e){}savePersonalMode()});home();
